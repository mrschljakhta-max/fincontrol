<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Темний гірський краєвид над озером у бордових сутінках">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2=".2" y2="1">
  <stop offset="0" stop-color="#0d1622"/>
  <stop offset=".37" stop-color="#182333"/>
  <stop offset=".69" stop-color="#332530"/>
  <stop offset=".91" stop-color="#63303d"/>
  <stop offset="1" stop-color="#21232b"/>
 </linearGradient>
 <radialGradient id="lastlight" cx=".84" cy=".49" r=".57">
  <stop offset="0" stop-color="#c14e5e" stop-opacity=".62"/>
  <stop offset=".24" stop-color="#903645" stop-opacity=".35"/>
  <stop offset=".62" stop-color="#493041" stop-opacity=".18"/>
  <stop offset="1" stop-color="#1d2430" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="peakA" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#28303d"/>
  <stop offset="1" stop-color="#101b28"/>
 </linearGradient>
 <linearGradient id="peakB" x1="0" y1="0" x2=".2" y2="1">
  <stop offset="0" stop-color="#1f2633"/>
  <stop offset="1" stop-color="#0c1722"/>
 </linearGradient>
 <linearGradient id="lake" x1=".1" y1="0" x2=".8" y2="1">
  <stop offset="0" stop-color="#2b2733"/>
  <stop offset=".45" stop-color="#171e2c"/>
  <stop offset=".95" stop-color="#101923"/>
 </linearGradient>
 <radialGradient id="reflection" cx=".68" cy="0" r=".85">
  <stop offset="0" stop-color="#a43c4b" stop-opacity=".32"/>
  <stop offset=".32" stop-color="#643041" stop-opacity=".2"/>
  <stop offset="1" stop-color="#111b25" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#FA2F4C" stop-opacity=".22"/>
  <stop offset="1" stop-color="#FA2F4C" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="veil" x1="0" y1="0" x2="1" y2=".1">
  <stop offset="0" stop-color="#131A20" stop-opacity=".61"/>
  <stop offset=".5" stop-color="#131A20" stop-opacity=".26"/>
  <stop offset="1" stop-color="#131A20" stop-opacity=".42"/>
 </linearGradient>
 <filter id="fog" x="-25%" y="-90%" width="150%" height="280%">
  <feGaussianBlur stdDeviation="36"/>
 </filter>
 <filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence baseFrequency=".33" numOctaves="2" seed="8" stitchTiles="stitch" type="fractalNoise"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer>
 </filter>
</defs>
